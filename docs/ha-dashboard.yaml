# Example Home Assistant dashboard for the SRP Energy Monitor integration.
#
# Paste this into a dashboard in raw-configuration-editor mode
# (dashboard -> pencil -> three dots -> "Raw configuration editor").
#
# Replace 123456789 with your own SRP account number everywhere it appears --
# it is part of both the entity ids and the statistic ids.
#
# The JuiceBox helpers on the "Daily Shape" view are input_booleans from a
# separate project; delete those cards if you do not have them.
#
# There is one markdown card on the whole dashboard, and the figures in it were
# measured on one account over the 2026-08-10 -> 08-28 cycle. Rewrite it once
# you can see your own, or drop it.
views:
- title: Bill Cycle
  path: cycle
  icon: mdi:cash-clock
  type: sections
  max_columns: 2
  badges:
  - type: entity
    entity: sensor.srp_account_123456789_bill_projection
    name: Projected
  - type: entity
    entity: sensor.srp_account_123456789_current_demand
    name: Billed demand
  - type: entity
    entity: sensor.srp_account_123456789_billed_cycle_peak
    name: Worst half hour
  sections:
  - type: grid
    cards:
    - type: heading
      heading: This cycle
      heading_style: title
      icon: mdi:currency-usd
    - type: tile
      entity: sensor.srp_account_123456789_bill_projection
      name: Projected bill
      vertical: true
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: sensor.srp_account_123456789_billed_cycle_peak
      name: Worst half hour
      vertical: true
      grid_options:
        columns: 6
        rows: 2
    - type: gauge
      entity: sensor.srp_account_123456789_current_demand
      name: Billed demand
      min: 0
      max: 15
      needle: true
      severity:
        green: 0
        yellow: 6
        red: 9
      grid_options:
        columns: full
        rows: 3
  - type: grid
    cards:
    - type: heading
      heading: Demand
      heading_style: title
      icon: mdi:flash-alert
    - type: statistics-graph
      title: Daily on-peak maximum
      entities:
      - srp_energy_monitor:123456789_demand_kw
      stat_types:
      - max
      period: day
      days_to_show: 45
      chart_type: line
      hide_legend: true
      grid_options:
        columns: full
        rows: 6
  - type: grid
    cards:
    - type: heading
      heading: Energy
      heading_style: title
      icon: mdi:home-lightning-bolt
    - type: statistic
      entity: srp_energy_monitor:123456789_energy_consumption
      name: Grid draw, this month
      stat_type: change
      period:
        calendar:
          period: month
      grid_options:
        columns: 6
    - type: statistic
      entity: srp_energy_monitor:123456789_energy_generation
      name: Generation, this month
      stat_type: change
      period:
        calendar:
          period: month
      grid_options:
        columns: 6
    - type: statistic
      entity: srp_energy_monitor:123456789_energy_consumption
      name: Grid draw, 30 days
      stat_type: change
      period:
        rolling_window:
          duration:
            days: 30
      grid_options:
        columns: 6
    - type: statistic
      entity: srp_energy_monitor:123456789_energy_generation
      name: Generation, 30 days
      stat_type: change
      period:
        rolling_window:
          duration:
            days: 30
      grid_options:
        columns: 6
    - type: heading
      heading: Last settled day
      heading_style: subtitle
    - type: tile
      entity: sensor.srp_account_123456789_daily_consumption
      name: Consumption
      vertical: true
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: sensor.srp_account_123456789_daily_generation
      name: On-peak generation
      vertical: true
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: sensor.srp_account_123456789_daily_net_energy
      name: Metered read
      vertical: true
      grid_options:
        columns: 6
        rows: 2
  - type: grid
    cards:
    - type: heading
      heading: Metered read
      heading_style: title
      icon: mdi:counter
    - type: statistics-graph
      title: Metered read, per day
      entities:
      - srp_energy_monitor:123456789_energy_net
      stat_types:
      - change
      period: day
      days_to_show: 60
      chart_type: bar
      hide_legend: true
      grid_options:
        columns: full
        rows: 6
- title: Daily Shape
  path: shape
  icon: mdi:chart-bell-curve
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Where the charge is set
      heading_style: title
      icon: mdi:clock-alert-outline
    - type: statistics-graph
      title: On-peak demand, last 7 days
      entities:
      - srp_energy_monitor:123456789_demand_kw
      stat_types:
      - max
      period: hour
      days_to_show: 7
      chart_type: line
      hide_legend: true
      grid_options:
        columns: full
        rows: 6
    - type: markdown
      grid_options:
        columns: full
      content: 'Nine of the ten days this cycle with any on-peak demand peaked at **19:30–20:00**. Flattening
        that half hour:


        | | Now | Flattened |

        |---|---|---|

        | Billed demand (E-15) | 6.11 kW | **2.61 kW** |

        | Worst half hour (E-27) | 12.70 kW | 12.50 kW |'
  - type: grid
    cards:
    - type: heading
      heading: Hourly energy
      heading_style: title
      icon: mdi:transmission-tower
    - type: statistics-graph
      title: Grid draw vs generation, last 7 days
      entities:
      - srp_energy_monitor:123456789_energy_consumption
      - srp_energy_monitor:123456789_energy_generation
      stat_types:
      - change
      period: hour
      days_to_show: 7
      chart_type: bar
      hide_legend: false
      grid_options:
        columns: full
        rows: 6
    - type: heading
      heading: On-peak window
      heading_style: subtitle
    - type: tile
      entity: input_boolean.juicebox_srp_on_peak
      name: On-peak now
      vertical: true
      grid_options:
        columns: 4
        rows: 2
    - type: tile
      entity: input_boolean.juicebox_srp_holiday
      name: SRP holiday
      vertical: true
      grid_options:
        columns: 4
        rows: 2
    - type: tile
      entity: input_boolean.juicebox_srp_schedule_valid
      name: Schedule valid
      vertical: true
      grid_options:
        columns: 4
        rows: 2
    - type: history-graph
      hours_to_show: 72
      grid_options:
        columns: full
        rows: 3
      entities:
      - entity: input_boolean.juicebox_srp_on_peak
        name: On-peak
      - entity: input_boolean.juicebox_srp_holiday
        name: Holiday
- title: History
  path: history
  icon: mdi:history
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Energy
      heading_style: title
      icon: mdi:database-clock
    - type: statistics-graph
      title: Grid draw, per day
      entities:
      - srp_energy_monitor:123456789_energy_consumption
      stat_types:
      - change
      period: day
      days_to_show: 760
      chart_type: bar
      hide_legend: true
      grid_options:
        columns: full
        rows: 6
    - type: statistics-graph
      title: Generation, per day
      entities:
      - srp_energy_monitor:123456789_energy_generation
      stat_types:
      - change
      period: day
      days_to_show: 760
      chart_type: bar
      hide_legend: true
      grid_options:
        columns: full
        rows: 6
  - type: grid
    cards:
    - type: heading
      heading: Demand
      heading_style: title
      icon: mdi:chart-line
    - type: statistics-graph
      title: Daily on-peak maximum
      entities:
      - srp_energy_monitor:123456789_demand_kw
      stat_types:
      - max
      period: day
      days_to_show: 460
      chart_type: line
      hide_legend: true
      grid_options:
        columns: full
        rows: 6
    - type: statistics-graph
      title: Metered read, per day
      entities:
      - srp_energy_monitor:123456789_energy_net
      stat_types:
      - change
      period: day
      days_to_show: 760
      chart_type: bar
      hide_legend: true
      grid_options:
        columns: full
        rows: 6
