[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srp-energy-monitor"
version = "1.0.0"
description = "Collect, store, chart and serve your Salt River Project (SRP) peak demand and energy data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["srp", "salt river project", "energy", "solar", "peak demand", "utility", "home automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
scrape = ["playwright>=1.40", "python-dotenv>=1.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
all = ["srp-energy-monitor[scrape,api]"]
dev = ["srp-energy-monitor[all]", "pytest>=8.0", "httpx>=0.27"]

[project.scripts]
srp-energy-monitor = "srp_energy.cli:main"

[project.urls]
Homepage = "https://github.com/JeremyWhittaker/srp-energy-monitor"
Issues = "https://github.com/JeremyWhittaker/srp-energy-monitor/issues"

[tool.setuptools.packages.find]
include = ["srp_energy*"]

[tool.setuptools.package-data]
srp_energy = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
